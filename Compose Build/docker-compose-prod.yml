name: basic-app-prod

services:
  backend:
    image: saurav269/basic-app:latest
    restart: unless-stopped
    deploy:
      replicas: 3
    command: npm start
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis-service:6379
      - POSTGRES_URL=postgres://admin:password@postgres-service:5432/trialDB
    expose:
      - "8000"
    depends_on:
      redis-service:
        condition: service_started
      postgres-service:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  redis-service:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - trial-redis:/data

  postgres-service:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=admin
      - POSTGRES_DB=trialDB
    volumes:
      - trial-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d trialDB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trial-postgres:
  trial-redis:
  caddy_data:
  caddy_config:
